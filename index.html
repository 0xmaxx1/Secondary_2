<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار الوحدة الأولى - Madar Academy</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef3f8;color:#172033;font-family:Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:900px;margin:0 auto;padding:18px}
.hero{background:#fff;border:1px solid #dce6ef;border-radius:18px;padding:24px;margin:18px 0}
.brand{color:#0d5f9f;font-weight:800;font-size:20px}
h1{margin:8px 0 2px;color:#0a3d69;font-size:28px}
.meta{color:#65758a;font-size:14px}
.notice{margin-top:14px;background:#fff8e7;border-right:4px solid #dca11a;padding:12px 14px;border-radius:10px;font-size:14px}
.student{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
label{display:block;font-weight:700;font-size:14px}
input[type=text]{width:100%;padding:12px;border:1px solid #cbd6e2;border-radius:10px;font-size:16px;margin-top:5px}
.progress{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff;border:1px solid #dce6ef;border-radius:12px;padding:12px 14px;margin-bottom:14px;position:sticky;top:8px;z-index:5}
.bar{height:8px;background:#e5edf4;border-radius:999px;overflow:hidden;flex:1}
.bar > div{height:100%;width:0;background:#0d5f9f;transition:width .2s}
.q{background:#fff;border:1px solid #dce6ef;border-radius:14px;padding:18px;margin-bottom:14px}
.q h3{font-size:16px;margin:0 0 12px}
.num{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;background:#0d5f9f;color:white;font-size:13px;margin-left:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid #dbe4ec;border-radius:10px;padding:11px 12px;margin:8px 0;cursor:pointer}
.choice:hover{background:#f7fafc}
.choice input{margin-top:5px;transform:scale(1.2)}
.actions{background:#fff;border:1px solid #dce6ef;border-radius:14px;padding:18px;margin:18px 0}
button{border:0;border-radius:10px;padding:13px 18px;font-size:16px;font-weight:800;cursor:pointer;background:#0d5f9f;color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
.error{color:#b42318;font-weight:700;margin-top:10px}
.result{background:#fff;border:1px solid #dce6ef;border-radius:18px;padding:28px;text-align:center;margin:24px 0}
.score{font-size:48px;font-weight:900;color:#0d5f9f}
.hidden{display:none!important}
.locked{background:#f8fafc;border:1px solid #dce6ef;border-radius:14px;padding:20px;margin-top:16px}
.small{font-size:13px;color:#65758a}
@media(max-width:650px){.student{grid-template-columns:1fr}h1{font-size:23px}.wrap{padding:10px}.q{padding:14px}}
@media print{body{background:#fff}.progress,.actions{display:none}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <section class="hero">
    <div class="brand">MADAR ACADEMY</div>
    <h1>اختبار الوحدة الأولى</h1>
    <div class="meta">البرمجة والذكاء الاصطناعي – الصف الثاني الثانوي (بكالوريا)</div>
    <div class="meta">Mr: Mohamed Reda — 01550728782</div>
    <div class="notice"><strong>تنبيه:</strong> الاختبار يسمح بمحاولة واحدة فقط على نفس المتصفح والجهاز. بعد تسليم الإجابات ستظهر الدرجة ويُغلق الاختبار.</div>
    <div class="student" id="studentFields">
      <label>اسم الطالب
        <input id="studentName" type="text" autocomplete="name" placeholder="اكتب الاسم كاملًا">
      </label>
      <label>الكود / رقم الطالب
        <input id="studentCode" type="text" inputmode="numeric" placeholder="اكتب كود الطالب">
      </label>
    </div>
  </section>

  <div id="lockedView" class="locked hidden"></div>

  <div id="examView">
    <div class="progress">
      <strong id="progressText">0 / 52</strong>
      <div class="bar"><div id="barFill"></div></div>
    </div>
    <form id="examForm"></form>
    <div class="actions">
      <button id="submitBtn" type="button">تسليم الامتحان وإظهار الدرجة</button>
      <div id="errorMsg" class="error"></div>
      <div class="small">لن يتم قبول التسليم قبل الإجابة عن جميع الأسئلة.</div>
    </div>
  </div>

  <div id="resultView" class="result hidden" aria-live="polite"></div>
</div>

<script>

const LETTERS = ["أ","ب","ج","د"];
const STORAGE_KEY = "madar_unit1_mcq_v1_submitted";

const form = document.getElementById("examForm");
const progressText = document.getElementById("progressText");
const barFill = document.getElementById("barFill");
const submitBtn = document.getElementById("submitBtn");
const errorMsg = document.getElementById("errorMsg");
const examView = document.getElementById("examView");
const lockedView = document.getElementById("lockedView");
const resultView = document.getElementById("resultView");
const studentFields = document.getElementById("studentFields");
const studentName = document.getElementById("studentName");
const studentCode = document.getElementById("studentCode");

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function renderQuestions() {
  form.innerHTML = QUESTIONS.map((item, idx) => `
    <section class="q">
      <h3><span class="num">${idx+1}</span>${esc(item.q)}</h3>
      ${item.opts.map((opt, oi) => `
        <label class="choice">
          <input type="radio" name="q${idx}" value="${oi}">
          <span><strong>${LETTERS[oi]})</strong> ${esc(opt)}</span>
        </label>`).join("")}
    </section>`).join("");
  form.addEventListener("change", updateProgress);
}

function getAnsweredCount() {
  let n = 0;
  for (let i=0;i<QUESTIONS.length;i++) {
    if (form.querySelector(`input[name="q${i}"]:checked`)) n++;
  }
  return n;
}

function updateProgress() {
  const n = getAnsweredCount();
  progressText.textContent = `${n} / ${QUESTIONS.length}`;
  barFill.style.width = `${(n/QUESTIONS.length)*100}%`;
  errorMsg.textContent = "";
}

function showLocked(data) {
  examView.classList.add("hidden");
  studentFields.classList.add("hidden");
  lockedView.classList.remove("hidden");
  lockedView.innerHTML = `
    <h2>تم إنهاء المحاولة بالفعل</h2>
    <p><strong>الطالب:</strong> ${esc(data.name || "—")}</p>
    <p><strong>الكود:</strong> ${esc(data.code || "—")}</p>
    <p><strong>الدرجة:</strong> ${data.score} / ${QUESTIONS.length} (${data.percent}%)</p>
    <p class="small">لا يمكن بدء محاولة جديدة من هذا المتصفح بعد التسليم.</p>`;
}

function submitExam() {
  const name = studentName.value.trim();
  const code = studentCode.value.trim();
  if (!name || !code) {
    errorMsg.textContent = "اكتب اسم الطالب والكود قبل التسليم.";
    window.scrollTo({top:0,behavior:"smooth"});
    return;
  }
  const answered = getAnsweredCount();
  if (answered !== QUESTIONS.length) {
    errorMsg.textContent = `متبقي ${QUESTIONS.length - answered} سؤال بدون إجابة.`;
    return;
  }
  if (!confirm("هل أنت متأكد من تسليم الامتحان؟ بعد التسليم لن تستطيع المحاولة مرة أخرى على هذا الجهاز والمتصفح.")) return;

  let score = 0;
  for (let i=0;i<QUESTIONS.length;i++) {
    const selected = form.querySelector(`input[name="q${i}"]:checked`);
    if (selected && Number(selected.value) === ANSWERS[i]) score++;
  }
  const percent = Math.round((score/QUESTIONS.length)*100);
  const payload = {name, code, score, percent, submittedAt:new Date().toISOString()};
  localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));

  examView.classList.add("hidden");
  studentFields.classList.add("hidden");
  resultView.classList.remove("hidden");
  resultView.innerHTML = `
    <h2>تم تسليم الامتحان</h2>
    <div class="score">${score} / ${QUESTIONS.length}</div>
    <div><strong>${percent}%</strong></div>
    <p>${esc(name)} — كود: ${esc(code)}</p>
    <p class="small">تم تسجيل المحاولة على هذا المتصفح، ولن يسمح بإعادة الامتحان منه.</p>`;
  window.scrollTo({top:0,behavior:"smooth"});
}

const existing = localStorage.getItem(STORAGE_KEY);
if (existing) {
  try { showLocked(JSON.parse(existing)); }
  catch(e) { localStorage.removeItem(STORAGE_KEY); renderQuestions(); }
} else {
  renderQuestions();
  submitBtn.addEventListener("click", submitExam);
}
